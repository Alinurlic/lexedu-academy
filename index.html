<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LexEdu Academy — подготовка к ЕНТ (ҰБТ), SAT и IELTS: полноформатные пробные экзамены, банк заданий, умный анализ и ИИ-помощник Lexi." />
    <title>LexEdu Academy — ЕНТ, SAT, IELTS</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('lexedu-store') || localStorage.getItem('exampilot-store') || '{}');
        var t = (s.state && s.state.profile && s.state.profile.theme) || 'dark';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { document.documentElement.classList.add('dark'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
